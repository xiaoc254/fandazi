name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 最小权限：
#  - contents: read       只读代码
#  - pages: write         发布到 Pages
#  - id-token: write      OIDC 换取部署令牌（替代长期 token）
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Recommend / data invariants check
        run: npm run check:recommend

      # 只构建前端。npm run build 会连带 esbuild 打包 Express server，
      # Pages 用不到，反而多一个可能失败/变慢的环节。
      - name: Build static site
        run: npm run build:pages

      # 应用用 hash 路由（wouter/useHashLocation），正常不需要服务端回退；
      # 复制一份 404.html 只为兜住手输 /fandazi/takeout 这类无 hash 的地址。
      - name: Add 404 fallback
        run: cp dist/public/index.html dist/public/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
